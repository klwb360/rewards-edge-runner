name: Cross-platform fixture checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install isolated Edge runtime
        run: python -m playwright install msedge
      - name: Python fixture tests
        run: python -m unittest discover -s tests -v
      - name: Windows and BAT checks
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_launcher.ps1
          exit $LASTEXITCODE
      - name: Check dependencies
        run: python -m pip check
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base: ['ubuntu:24.04', 'debian:13']
    steps:
      - uses: actions/checkout@v6
      - name: Install and check Linux environment
        run: docker build --build-arg BASE_IMAGE='${{ matrix.base }}' -f tests/linux/Dockerfile -t rewards-fixtures .
      - name: Isolated Linux tests including headed Edge
        run: docker run --rm --shm-size=1g rewards-fixtures
